<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Is There a Bank Near Here?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Overpass:wght@600;800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
/* Layout idea: a street-sign themed workbook — one column of numbered exercise "blocks", each a sign-green header plate over a sidewalk-grey panel; the town map is the centrepiece. */
:root{
  --bg:#eef1ee;
  --panel:#ffffff;
  --ink:#1d2421;
  --muted:#5b6661;
  --line:#d3dad6;
  --sign:#0d6b4f;
  --sign-ink:#ffffff;
  --accent:#f2b705;
  --accent-ink:#1d2421;
  --bs:#1f4fa3;
  --tr:#c22b2b;
  --good:#1f8a4c;
  --bad:#c0392b;
  --asphalt:#4a514e;
  --walk:#c9d0cc;
  --b-civic:#cfe0f5;
  --b-shop:#f6e3c4;
  --b-move:#e3dcef;
  --b-green:#bfe3b4;
  --b-stroke:#7c8781;
  --note:#fff8de;
  --font-display:"Overpass","Arial Narrow",Arial,sans-serif;
  --font-body:"Atkinson Hyperlegible",Verdana,Arial,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121715; --panel:#1b2220; --ink:#e8eeeb; --muted:#9aa6a0; --line:#2f3935;
    --sign:#1c8a67; --sign-ink:#ffffff; --accent:#f2c230; --accent-ink:#141a17;
    --bs:#3d6fd1; --tr:#d04444; --good:#4cc27e; --bad:#ef6b5b;
    --asphalt:#2b3230; --walk:#3d4744;
    --b-civic:#2c4566; --b-shop:#5a4a2c; --b-move:#463d5a; --b-green:#2f5a33; --b-stroke:#7d8a84;
    --note:#2a2a1c;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#121715; --panel:#1b2220; --ink:#e8eeeb; --muted:#9aa6a0; --line:#2f3935;
  --sign:#1c8a67; --sign-ink:#ffffff; --accent:#f2c230; --accent-ink:#141a17;
  --bs:#3d6fd1; --tr:#d04444; --good:#4cc27e; --bad:#ef6b5b;
  --asphalt:#2b3230; --walk:#3d4744;
  --b-civic:#2c4566; --b-shop:#5a4a2c; --b-move:#463d5a; --b-green:#2f5a33; --b-stroke:#7d8a84;
  --note:#2a2a1c;
  color-scheme:dark;
}

*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:17px;line-height:1.5}
h1,h2,h3{font-family:var(--font-display);text-wrap:balance;margin:0}
h3{font-size:19px}
button,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:980px;margin:0 auto;padding:0 16px 64px}

/* header */
.top{background:var(--sign);color:var(--sign-ink);border-bottom:6px solid var(--accent)}
.top .wrap{padding-top:28px;padding-bottom:22px;display:grid;gap:14px}
.top .unit{font-family:var(--font-display);font-weight:600;letter-spacing:.08em;text-transform:uppercase;font-size:13px;opacity:.85}
.top h1{font-size:clamp(28px,5vw,44px);font-weight:800;line-height:1.1}
.top .note{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.25);color:var(--sign-ink);max-width:680px}
.top .note .trbtn{color:var(--sign-ink);border-color:rgba(255,255,255,.5)}
.langbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.langbar span{font-size:14px;opacity:.9;margin-right:4px}
.langbtn{border:2px solid rgba(255,255,255,.6);background:transparent;color:var(--sign-ink);padding:6px 14px;border-radius:999px;cursor:pointer;font-weight:700;font-size:15px}
.langbtn[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}

nav.jump{display:flex;flex-wrap:wrap;gap:6px;margin:18px 0 6px}
nav.jump a{font-size:14px;text-decoration:none;color:var(--ink);border:1px solid var(--line);background:var(--panel);padding:5px 12px;border-radius:6px}
nav.jump a:hover{border-color:var(--sign)}

/* section blocks */
section.block{margin-top:28px;background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden;scroll-margin-top:12px}
.plate{display:flex;align-items:flex-start;gap:12px;background:var(--sign);color:var(--sign-ink);padding:10px 16px;width:100%;border:0;text-align:left;cursor:pointer}
.plate .num{font-family:var(--font-display);font-weight:800;background:var(--sign-ink);color:var(--sign);min-width:30px;height:30px;padding:0 6px;border-radius:6px;display:grid;place-items:center;flex:none}
.plate h2{font-size:21px;font-weight:800;letter-spacing:.01em;padding-top:2px}
.plate h2::after{content:" ⇄";font-weight:400;font-size:15px;opacity:.75}
.plate .ptitle{display:grid;gap:4px}
.plate .out{display:none;flex-direction:column;gap:2px;font-size:15px;padding-bottom:2px}
.plate.open .out{display:flex}
.body{padding:18px 16px 22px;display:grid;gap:18px}
.sub{display:grid;gap:12px}

/* translation lines */
.trline{display:flex;gap:8px;align-items:baseline}
.tag{font-family:var(--font-display);font-weight:800;font-size:11px;letter-spacing:.06em;padding:1px 6px;border-radius:4px;color:#fff;flex:none}
.tag.bs{background:var(--bs)} .tag.tr{background:var(--tr)}
body[data-lang="bs"] .trline.tr, body[data-lang="tr"] .trline.bs{display:none}
body[data-lang="bs"] .lbl-tr, body[data-lang="tr"] .lbl-bs, body[data-lang="bs"] .lbl-dot, body[data-lang="tr"] .lbl-dot{display:none}

/* translatable chip */
.tx{display:inline-flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:left;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:8px 12px;cursor:pointer;transition:border-color .15s}
.tx:hover{border-color:var(--sign)}
.tx .en{font-weight:700}
.tx .en::after{content:" ⇄";font-weight:400;color:var(--muted);font-size:13px}
.tx.open{border-color:var(--sign);background:var(--panel)}
.tx .out{display:none;gap:3px;flex-direction:column;font-size:15px}
.tx.open .out{display:flex}

/* translatable instruction / explanation */
.note{display:grid;gap:6px;border:1px solid var(--line);border-left:4px solid var(--accent);background:var(--note);border-radius:8px;padding:10px 12px}
.note .en{margin:0}
.note .out{display:none;flex-direction:column;gap:4px;font-size:15px}
.note.open .out{display:flex}
.trbtn{justify-self:start;border:1px solid var(--line);background:transparent;border-radius:999px;padding:2px 10px;font-size:13px;font-weight:700;cursor:pointer;color:var(--muted)}
.trbtn:hover{border-color:var(--sign);color:var(--ink)}
.explain{display:grid;gap:10px;border:2px solid var(--accent);border-radius:10px;padding:14px;background:var(--panel)}
.explain-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.explain-head h3{font-size:18px}
.explain .note{border-left-width:4px;background:var(--bg)}
.explain .note .en b{color:var(--sign)}

/* places grid */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.cards .tx{width:100%}
.cards .pic{font-size:26px;line-height:1}

/* prepositions */
.preps{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.prep{display:grid;gap:8px;border:1px solid var(--line);border-radius:8px;padding:10px;background:var(--bg);align-content:start}
.prep svg{width:100%;height:auto;max-height:90px}
.prep .tx{width:100%;background:var(--panel)}
.box-t{fill:var(--bs);opacity:.85}
.box-o{fill:var(--panel);stroke:var(--b-stroke);stroke-width:2}
.arrow{stroke:var(--tr);stroke-width:3;fill:none}
.arrowhead{fill:var(--tr)}

/* phrases + dialogue */
.phrases{display:flex;flex-wrap:wrap;gap:10px}
.dialog{display:grid;gap:8px}
.dline{display:grid;grid-template-columns:110px 1fr;gap:10px;align-items:start}
.dline > b{font-family:var(--font-display);padding-top:8px;color:var(--muted);font-size:15px}
.turns{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
.turn{display:grid;gap:8px;border:1px solid var(--line);border-radius:8px;padding:10px;background:var(--bg);align-content:start}
.turn svg{width:100%;height:90px}
.turn .tx{width:100%;background:var(--panel)}
.road{fill:var(--walk)}
.bigarrow{fill:none;stroke:var(--bad);stroke-width:9;stroke-linecap:round;stroke-linejoin:round}
.bigarrowhead{fill:var(--bad)}

/* gap-fill dialogue */
.gline{display:grid;grid-template-columns:110px 1fr;gap:10px;align-items:start;padding:8px 0;border-bottom:1px dashed var(--line)}
.gline > b{font-family:var(--font-display);color:var(--muted);font-size:15px;padding-top:4px}
.gtext{display:grid;gap:6px}
.gtext .line{line-height:2.2}
.gtext .out{display:none;flex-direction:column;gap:3px;font-size:15px}
.gtext.open .out{display:flex}
select.gapsel{border:2px solid var(--line);background:var(--panel);border-radius:6px;padding:2px 6px;font-weight:700;margin:0 2px}
select.gapsel.ok{border-color:var(--good);background:color-mix(in srgb,var(--good) 15%,var(--panel))}
select.gapsel.no{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,var(--panel))}
.fix{color:var(--good);font-weight:700;font-size:14px;margin-left:2px}

/* map */
.mapbox{overflow-x:auto;border-radius:8px;border:1px solid var(--line);background:var(--walk)}
.mapbox svg{display:block;width:100%;min-width:620px;height:auto}
.m-asphalt{fill:var(--asphalt)}
.m-walk{fill:var(--walk)}
.m-dash{stroke:#e9e4c8;stroke-width:2;stroke-dasharray:10 10;opacity:.6}
.m-road-label{fill:#f4f4f4;font-family:var(--font-display);font-weight:600;font-size:13px;letter-spacing:.05em}
.bld{stroke:var(--b-stroke);stroke-width:1.5;transition:stroke .2s, stroke-width .2s}
.bld.civic{fill:var(--b-civic)} .bld.shop{fill:var(--b-shop)} .bld.move{fill:var(--b-move)} .bld.green{fill:var(--b-green)}
.blabel{fill:var(--ink);font-family:var(--font-body);font-weight:700;font-size:13px;pointer-events:none}
.bicon{font-size:20px;pointer-events:none}
.bgroup.clickable{cursor:pointer}
.bgroup.clickable:hover .bld{stroke:var(--sign);stroke-width:3}
.bgroup.hl .bld{stroke:var(--accent);stroke-width:5}
.bgroup.ok .bld,.bgroup.clickable.ok:hover .bld{stroke:var(--good);stroke-width:6}
.bgroup.no .bld,.bgroup.clickable.no:hover .bld{stroke:var(--bad);stroke-width:6}
.you circle{fill:var(--accent);stroke:#1d2421;stroke-width:2}
.you text{font-family:var(--font-display);font-weight:800;font-size:12px;fill:#1d2421}
.route{fill:none;stroke:var(--accent);stroke-width:7;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:2 14}
@media (prefers-reduced-motion:no-preference){
  .route.draw{animation:dash 1.6s linear infinite}
  @keyframes dash{to{stroke-dashoffset:-32}}
}

/* quiz */
.qcard{display:grid;gap:12px;border:2px solid var(--line);border-radius:10px;padding:14px;background:var(--bg)}
.qhead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.qnum{font-family:var(--font-display);font-weight:800;color:var(--muted);font-size:14px;letter-spacing:.05em;text-transform:uppercase}
.score{font-family:var(--font-display);font-weight:800;background:var(--sign);color:var(--sign-ink);padding:3px 10px;border-radius:6px;font-variant-numeric:tabular-nums}
.qtext{font-size:20px;font-weight:700}
.gap{display:inline-block;min-width:110px;border-bottom:3px solid var(--accent);text-align:center;padding:0 4px}
.bigpic{font-size:64px;line-height:1}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opts.stack{flex-direction:column;align-items:stretch}
.opt{border:2px solid var(--line);background:var(--panel);border-radius:8px;padding:8px 14px;cursor:pointer;font-weight:700;text-align:left}
.opt:hover:not(:disabled){border-color:var(--sign)}
.opt.ok{border-color:var(--good);background:color-mix(in srgb,var(--good) 18%,var(--panel))}
.opt.no{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 14%,var(--panel))}
.opt:disabled{cursor:default}
.feedback{display:grid;gap:2px;min-height:1.5em}
.feedback .msg{font-weight:700}
.feedback.ok .msg{color:var(--good)} .feedback.no .msg{color:var(--bad)}
.feedback .trline{font-size:14px;color:var(--muted)}
.nav{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:none;background:var(--sign);color:var(--sign-ink);padding:9px 16px;border-radius:8px;cursor:pointer;font-weight:700}
.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--line)}
.btn:disabled{opacity:.45;cursor:default}
.steps{display:flex;flex-wrap:wrap;gap:8px}
.steps .tx{background:var(--panel)}
.done{padding:14px;border-radius:8px;background:color-mix(in srgb,var(--good) 14%,var(--panel));display:grid;gap:4px}
.done .msg{font-weight:700;font-size:19px}
.after{display:flex;flex-wrap:wrap;gap:8px}

/* word order */
.built{min-height:52px;display:flex;flex-wrap:wrap;gap:6px;padding:8px;border:2px dashed var(--line);border-radius:8px;background:var(--panel)}
.built.ok{border-color:var(--good);border-style:solid}
.built.no{border-color:var(--bad);border-style:solid}
.pool{display:flex;flex-wrap:wrap;gap:6px}
.word{border:2px solid var(--line);background:var(--panel);border-radius:6px;padding:5px 11px;cursor:pointer;font-weight:700}
.word:hover:not(:disabled){border-color:var(--sign)}
.word.used{visibility:hidden}
.built .word{background:var(--note)}

/* in/at/on sorter */
.sorter{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:8px}
.srow{display:grid;grid-template-columns:auto 1fr;gap:8px;align-items:center;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--bg)}
.srow .choices{display:flex;gap:4px}
.srow .choices .opt{padding:4px 10px}
.srow .phrase{font-weight:700}
.srow .out{grid-column:1 / -1;display:none;flex-direction:column;gap:2px;font-size:14px}
.srow.answered .out{display:flex}
.tally{font-family:var(--font-display);font-weight:800}

/* your turn */
.yt{display:grid;gap:10px}
.yt label{font-weight:700}
.yt select{border:2px solid var(--line);background:var(--panel);border-radius:6px;padding:6px 10px;max-width:280px}
.yt textarea{width:100%;min-height:110px;border:2px solid var(--line);border-radius:8px;padding:10px;background:var(--panel);resize:vertical}
.wordbank{display:flex;flex-wrap:wrap;gap:6px}
.wordbank span{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:2px 8px;font-size:15px}

footer{margin-top:32px;color:var(--muted);font-size:14px}
@media (max-width:560px){
  .dline,.gline{grid-template-columns:1fr}
  .dline > b,.gline > b{padding-top:0}
}
</style>
</head>

const $ = q => document.querySelector(q);
function el(tag, attrs={}, kids=[]){
  const e=document.createElement(tag);
  for(const [k,v] of Object.entries(attrs)){
    if(k==="class") e.className=v; else if(k==="text") e.textContent=v; else e.setAttribute(k,v);
  }
  [].concat(kids).forEach(k=>{ if(k!==null && k!==undefined && k!==false) e.append(k); });
  return e;
}
function trLines(bs,tr){
  return el("span",{class:"out"},[
    el("span",{class:"trline bs"},[el("span",{class:"tag bs",text:"BS"}),el("span",{text:bs})]),
    el("span",{class:"trline tr"},[el("span",{class:"tag tr",text:"TR"}),el("span",{text:tr})])
  ]);
}
function toggler(node, ctrl){
  (ctrl||node).addEventListener("click",()=>{ const o=node.classList.toggle("open"); (ctrl||node).setAttribute("aria-expanded",o); });
}
function chip(en,bs,tr,pre){
  const b=el("button",{class:"tx",type:"button","aria-expanded":"false"});
  if(pre) b.append(pre);
  b.append(el("span",{class:"en",text:en}),trLines(bs,tr));
  toggler(b); return b;
}
function trBtnLabel(){
  return [el("span",{class:"lbl-bs",text:"⇄ Prevedi"}),el("span",{class:"lbl-dot",text:" · "}),el("span",{class:"lbl-tr",text:"Çevir"})];
}
/* instruction or explanation with a translate button; en may contain <b> markup marked with ** */
function note(t){
  const [en,bs,tr]=t;
  const d=el("div",{class:"note"});
  const p=el("p",{class:"en"});
  en.split("**").forEach((part,i)=>p.append(i%2? el("b",{text:part}) : part));
  const btn=el("button",{class:"trbtn",type:"button","aria-expanded":"false"},trBtnLabel());
  d.append(p,trLines(bs,tr),btn);
  toggler(d,btn);
  return d;
}
function explain(items){

      g.classList.add("clickable");

    }
    v.append(g); groups[id]=g;

  const route=s("polyline",{class:"route",points:""});

/* =========================================================
   QUIZ RUNNER
   ========================================================= */
function runQuiz(root,items,render){
  let i=0,score=0,answered=new Array(items.length).fill(null),order=items;
  function start(){ order = render.shuffle ? shuffle(items) : items; i=0; score=0; answered.fill(null); draw(); }
  function draw(){
    root.innerHTML="";
    if(i>=order.length){
      const d=el("div",{class:"done"},[el("span",{class:"msg",text:`${UI.done[0]} ${score} / ${order.length}`}),
        fbLine([null,`${UI.done[1]} ${score} / ${order.length}`,`${UI.done[2]} ${score} / ${order.length}`])]);
      const again=el("button",{class:"btn",type:"button",text:"Try again"});
      again.onclick=start;
      root.append(d,el("div",{class:"nav"},[again]));
      render.onEnd && render.onEnd();
      return;
    }
    const head=el("div",{class:"qhead"},[
      el("span",{class:"qnum",text:`Question ${i+1} of ${order.length}`}),
      el("span",{class:"score",text:`Score ${score} / ${order.length}`})
    ]);
    const fb=el("div",{class:"feedback","aria-live":"polite"});
    const next=el("button",{class:"btn",type:"button",text:i===order.length-1?"See score":"Next"});
    next.disabled=answered[i]===null;
    next.onclick=()=>{i++;draw();};
    root.append(head);
    render.draw(root,order[i],ok=>{
      if(answered[i]!==null) return;
      answered[i]=ok; if(ok) score++;
      head.querySelector(".score").textContent=`Score ${score} / ${order.length}`;
      setFb(fb,ok); next.disabled=false;
    },fb);
    root.append(fb,el("div",{class:"nav"},[next]));
  }
  start();
}
/* gap-choice question used by several quizzes */
function gapQuestion(q, opts){
  return {
    shuffle: opts && opts.shuffle,
    draw(root,item,answer){
      const qt=el("div",{class:"qtext"});
      if(item.s[0]) qt.append(item.s[0]+" ");
      qt.append(el("span",{class:"gap",text:"?"}));
      if(item.s[1]) qt.append((/^[.,?!]/.test(item.s[1])?"":" ")+item.s[1]);
      const optsBox=el("div",{class:"opts"});
      const after=el("div",{class:"after"});
      (item.o||q).forEach(o=>{
        const b=el("button",{class:"opt",type:"button",text:o});
        b.onclick=()=>{
          const ok=o===item.a;
          optsBox.querySelectorAll(".opt").forEach(x=>{x.disabled=true; if(x.textContent===item.a) x.classList.add("ok");});
          if(!ok) b.classList.add("no");
          qt.querySelector(".gap").textContent=item.a;
          const full=item.full || (item.s[0]+" "+item.a+" "+item.s[1]);
          after.append(chip(full,item.bs,item.tr));
          opts && opts.onAnswer && opts.onAnswer(item);
          answer(ok);
        };
        optsBox.append(b);
      });
      opts && opts.before && opts.before(item);
      root.append(qt,optsBox,after);
    }
  };
}

/* gap-fill dialogue with dropdowns */
function gapDialog(container,lines){
  const sels=[];
  lines.forEach(l=>{
    const text=el("div",{class:"gtext"});
    const line=el("div",{class:"line"});
    l.parts.forEach(p=>{
      if(typeof p==="string"){ line.append(p); return; }
      const sel=el("select",{class:"gapsel","aria-label":"Choose a word"});
      sel.append(el("option",{value:"",text:"…"}));
      shuffle(p.o).forEach(o=>sel.append(el("option",{value:o,text:o})));
      sel.dataset.a=p.a; sels.push(sel); line.append(sel);
    });
    const btn=el("button",{class:"trbtn",type:"button","aria-expanded":"false"},trBtnLabel());
    text.append(line,trLines(l.bs,l.tr),btn);
    toggler(text,btn);
    container.append(el("div",{class:"gline"},[el("b",{text:l.who}),text]));
  });
  const fb=el("div",{class:"feedback","aria-live":"polite"});
  const check=el("button",{class:"btn",type:"button",text:"Check answers"});
  const reset=el("button",{class:"btn ghost",type:"button",text:"Start again"});
  check.onclick=()=>{
    let n=0;
    container.querySelectorAll(".fix").forEach(f=>f.remove());
    sels.forEach(sel=>{
      const ok=sel.value===sel.dataset.a; if(ok) n++;
      sel.classList.toggle("ok",ok); sel.classList.toggle("no",!ok);
      if(!ok) sel.after(el("span",{class:"fix",text:"→ "+sel.dataset.a}));
    });
    fb.innerHTML=""; fb.className="feedback "+(n===sels.length?"ok":"no");
    fb.append(el("span",{class:"msg",text:`${n} / ${sels.length} correct`}),
      fbLine([null,`${n} / ${sels.length} tačno`,`${n} / ${sels.length} doğru`]));
  };
  reset.onclick=()=>{
    sels.forEach(sel=>{sel.value="";sel.classList.remove("ok","no");});
    container.querySelectorAll(".fix").forEach(f=>f.remove());
    fb.innerHTML=""; fb.className="feedback";
  };
  container.append(fb,el("div",{class:"nav"},[check,reset]));
}

    "Second Avenue'daki sarı noktadasın ve haritada yukarıya (kuzeye) bakıyorsun. Yol tarifini oku, sonra vardığın binaya tıkla. Çeviri gerekirse cümleye tıkla."]));
  const q=el("div",{class:"qcard"}); const mb=el("div",{class:"mapbox"}); b.append(q,mb);
  let pick=null;
  const map=buildMap(mb,{clickable:true,you:true,onPick:id=>pick&&pick(id)});
  runQuiz(q,FOLLOW,{
    draw(root,item,answer){
      map.clear();
      root.append(el("div",{class:"qtext",text:"Where are you? Click the building on the map."}));
      root.append(fbLine([null,"Gdje si? Klikni na zgradu na mapi.","Neredesin? Haritadaki binaya tıkla."]));
      const steps=el("div",{class:"steps"}); item.steps.forEach(k=>steps.append(chip(...P[k]))); root.append(steps);
      const after=el("div",{class:"after"});
      root.append(after);
      let done=false;
      pick=id=>{
        if(done) return; done=true;
        const ok=id===item.a, n=BLD[item.a].n;
        map.mark(item.a,"ok"); if(!ok) map.mark(id,"no");
        map.route(item.route);
        after.append(chip(`It's the ${n[0]}.`,`To je ${n[1]}.`,`Burası ${n[2]}.`));
        answer(ok);
      };
    },
    onEnd(){ map.clear(); pick=null; }
  });
}

/* 6 give directions */
{
  const b=section("give",["Give directions","Daj upute","Yol tarifi ver","Give directions"]);
  b.append(note(["A tourist asks you for help. You are at the yellow dot, looking north. Choose the correct directions. The route appears on the map when you answer.",
    "Turista te pita za pomoć. Ti si na žutoj tački i gledaš prema sjeveru. Izaberi tačne upute. Put se pojavi na mapi kad odgovoriš.",
    "Bir turist senden yardım istiyor. Sarı noktadasın ve kuzeye bakıyorsun. Doğru yol tarifini seç. Cevap verince yol haritada görünür."]));
  const q=el("div",{class:"qcard"}); const mb=el("div",{class:"mapbox"}); b.append(q,mb);
  const map=buildMap(mb,{you:true});
  runQuiz(q,GIVE,{
    draw(root,item,answer){
      map.clear();
      const n=BLD[item.a].n;
      root.append(el("div",{class:"qtext"},[el("span",{text:"Tourist: "}),chip(`Excuse me. Where's the ${n[0]}, please?`,`Izvinite. Gdje je ${n[1]}, molim vas?`,`Affedersiniz. ${capTR(n[2])} nerede, lütfen?`)]));
      const opts=el("div",{class:"opts stack"}); const after=el("div",{class:"after"});
      shuffle(item.o.map((keys,idx)=>({keys,correct:idx===0}))).forEach(o=>{
        const btn=el("button",{class:"opt",type:"button",text:joinP(o.keys,0)});
        btn.dataset.correct=o.correct;
        btn.onclick=()=>{
          opts.querySelectorAll(".opt").forEach(x=>{x.disabled=true; if(x.dataset.correct==="true") x.classList.add("ok");});
          if(!o.correct) btn.classList.add("no");
          map.mark(item.a,"ok"); map.route(item.route);
          after.append(chip(joinP(item.o[0],0),joinP(item.o[0],1),joinP(item.o[0],2)));
          answer(o.correct);
        };
        opts.append(btn);
      });
      root.append(opts,after);
    },
    onEnd(){ map.clear(); }

/* 7 complete the dialogue */
{
  const b=section("dialogue",["Complete the dialogue","Dopuni dijalog","Diyaloğu tamamla","Dialogue"]);
  b.append(note(["Choose the missing word for each gap. Then click Check answers. Use the translate button on each line if you need help.",

/* 8 word order */
{
  const b=section("word-order",["Put the words in order","Poredaj riječi","Kelimeleri sıraya koy","Word order"]);
  b.append(note(["Click the words in the correct order to make a sentence. Click a word in your sentence to take it back.",
    "Klikni na riječi pravilnim redom da napraviš rečenicu. Klikni na riječ u svojoj rečenici da je vratiš.",
    "Cümle kurmak için kelimelere doğru sırayla tıkla. Bir kelimeyi geri almak için cümlendeki kelimeye tıkla."]));
  const q=el("div",{class:"qcard"}); b.append(q);
  runQuiz(q,ORDER,{
    draw(root,item,answer){
      const tokens=item.en.split(" ").map((w,i)=>({w,i}));
      let mixed=shuffle(tokens); if(mixed.map(t=>t.w).join(" ")===item.en) mixed=mixed.reverse();
      const built=el("div",{class:"built","aria-label":"Your sentence"});
      const pool=el("div",{class:"pool"});
      const after=el("div",{class:"after"});
      let chosen=[], locked=false;
      mixed.forEach(t=>{
        const w=el("button",{class:"word",type:"button",text:t.w});
        w.onclick=()=>{
          if(locked||w.classList.contains("used")) return;
          w.classList.add("used");
          const c=el("button",{class:"word",type:"button",text:t.w});
          c.onclick=()=>{ if(locked) return; c.remove(); w.classList.remove("used"); chosen=chosen.filter(x=>x!==c); };
          chosen.push(c); built.append(c);
        };
        pool.append(w);
      });
      const check=el("button",{class:"btn",type:"button",text:"Check"});
      check.onclick=()=>{
        if(locked) return;
        const got=chosen.map(c=>c.textContent).join(" ");
        if(chosen.length<tokens.length) return;
        locked=true; check.disabled=true;
        const ok=got===item.en;
        built.classList.add(ok?"ok":"no");
        after.append(chip(item.en,item.bs,item.tr));
        answer(ok);
      };
      root.append(built,pool,el("div",{class:"nav"},[check]),after);
    }
  });
}

/* 9 hotel: there is / there are */
{
  const b=section("hotel",["In a hotel room: there is / there are","U hotelskoj sobi: there is / there are","Otel odasında: there is / there are","Hotel room"]);
  b.append(note(["Learn the hotel words. Click each one to check the translation.","Nauči riječi vezane za hotel. Klikni na svaku da provjeriš prijevod.","Otelle ilgili kelimeleri öğren. Çevirisini kontrol etmek için her birine tıkla."]));

    ["**There are** + two or more things: There are two beds.","There are + dvije ili više stvari: There are two beds. (Ima dva kreveta.)","There are + iki veya daha fazla şey: There are two beds. (İki yatak var.)"],
    ["Negative: There **isn't** a phone. There **aren't any** towels.","Odrično: There isn't a phone. (Nema telefona.) There aren't any towels. (Nema peškira.)","Olumsuz: There isn't a phone. (Telefon yok.) There aren't any towels. (Havlu yok.)"],
    ["Questions: **Is there** a TV? Yes, there is. / No, there isn't. **Are there any** towels? Yes, there are. / No, there aren't.",
     "Pitanja: Is there a TV? (Ima li televizor?) Yes, there is. / No, there isn't. Are there any towels? (Ima li peškira?) Yes, there are. / No, there aren't.",
     "Sorular: Is there a TV? (Televizyon var mı?) Yes, there is. / No, there isn't. Are there any towels? (Havlu var mı?) Yes, there are. / No, there aren't."],
    ["Use **any** with plural words in negatives and questions: Are there any chairs?","Koristi any s riječima u množini u odričnim rečenicama i pitanjima: Are there any chairs? (Ima li stolica?)","Olumsuz cümlelerde ve sorularda çoğul kelimelerle any kullan: Are there any chairs? (Sandalye var mı?)"]
  ]));
  b.append(el("h3",{text:"Choose the correct word"}));
  b.append(note(["Choose the correct word for each sentence.","Izaberi tačnu riječ za svaku rečenicu.","Her cümle için doğru kelimeyi seç."]));
  const q=el("div",{class:"qcard"}); b.append(q);
  runQuiz(q,THERE,gapQuestion(null));
  b.append(el("h3",{text:"At the hotel reception"}));
  b.append(note(["Complete the conversation at the hotel. Choose the missing words, then click Check answers.","Dopuni razgovor na recepciji hotela. Izaberi riječi koje nedostaju, pa klikni Check answers.","Otel resepsiyonundaki konuşmayı tamamla. Eksik kelimeleri seç, sonra Check answers düğmesine tıkla."]));
  const d=el("div",{class:"sub"}); b.append(d); gapDialog(d,DLG2);
}

/* 10 in / at / on + was / were */
{
  const b=section("where-were-you",["Where were you? in / at / on, was / were","Gdje si bio/bila? in / at / on, was / were","Neredeydin? in / at / on, was / were","Where were you?"]);
  b.append(explain([
    ["Past of be: I / he / she / it **was**. You / we / they **were**. Negative: **wasn't**, **weren't**.",
     "Prošlo vrijeme glagola be: I / he / she / it was. You / we / they were. Odrično: wasn't, weren't.",
     "be fiilinin geçmiş hâli: I / he / she / it was. You / we / they were. Olumsuz: wasn't, weren't."],
    ["Questions: **Where were** you? **Was** he at home? Yes, he was. / No, he wasn't.",
     "Pitanja: Where were you? (Gdje si bio/bila?) Was he at home? (Je li on bio kod kuće?) Yes, he was. / No, he wasn't.",
     "Sorular: Where were you? (Neredeydin?) Was he at home? (Evde miydi?) Yes, he was. / No, he wasn't."],
    ["**at** + home, work, school, the airport, the gym: I was at home.",
     "at + home, work, school, the airport, the gym: I was at home. (Bio/bila sam kod kuće.)",
     "at + home, work, school, the airport, the gym: I was at home. (Evdeydim.)"],
    ["**in** + rooms, cities, countries, bed, a car, a meeting: in the kitchen, in Chicago, in bed.",
     "in + prostorije, gradovi, države, bed, a car, a meeting: in the kitchen (u kuhinji), in Chicago, in bed (u krevetu).",
     "in + odalar, şehirler, ülkeler, bed, a car, a meeting: in the kitchen (mutfakta), in Chicago, in bed (yatakta)."],
    ["**on** + a bus, a train, a plane, a boat, the street: on a bus.",
     "on + a bus, a train, a plane, a boat, the street: on a bus (u autobusu).",
     "on + a bus, a train, a plane, a boat, the street: on a bus (otobüste)."]
  ]));
  b.append(el("h3",{text:"in, at or on?"}));
  b.append(note(["Choose in, at or on for each place. The translation appears when you answer.","Izaberi in, at ili on za svako mjesto. Prijevod se pojavi kad odgovoriš.","Her yer için in, at veya on seç. Cevap verince çeviri görünür."]));
  const tally=el("div",{class:"tally","aria-live":"polite"});
  const sorter=el("div",{class:"sorter"});
  let right=0,done=0;
  const upd=()=>{ tally.textContent=`Score ${right} / ${SORT.length}`+(done===SORT.length?"  ·  Finished!":""); };
  function buildSorter(){
    sorter.innerHTML=""; right=0; done=0; upd();
    shuffle(SORT).forEach(([ph,a,bs,tr])=>{
      const row=el("div",{class:"srow"});
      const ch=el("div",{class:"choices"});
      ["in","at","on"].forEach(o=>{
        const btn=el("button",{class:"opt",type:"button",text:o});
        btn.onclick=()=>{
          ch.querySelectorAll(".opt").forEach(x=>{x.disabled=true; if(x.textContent===a) x.classList.add("ok");});
          if(o!==a) btn.classList.add("no"); else right++;
          done++; row.classList.add("answered"); upd();
        };
        ch.append(btn);
      });
      row.append(ch,el("span",{class:"phrase",text:ph}),trLines(`${a} ${ph} = ${bs}`,`${a} ${ph} = ${tr}`));
      sorter.append(row);
    });
  }
  const again=el("button",{class:"btn ghost",type:"button",text:"Start again"});
  again.onclick=buildSorter;
  b.append(tally,sorter,el("div",{class:"nav"},[again]));
  buildSorter();
  b.append(el("h3",{text:"was or were?"}));
  b.append(note(["Choose the correct word for each sentence.","Izaberi tačnu riječ za svaku rečenicu.","Her cümle için doğru kelimeyi seç."]));
  const q=el("div",{class:"qcard"}); b.append(q);
  runQuiz(q,WAS,gapQuestion(null));
}

/* 11 your turn */
{
  const b=section("your-turn",["Your turn: write directions","Tvoj red: napiši upute","Sıra sende: yol tarifi yaz","Your turn"]);
  b.append(note(["You are at the yellow dot on the map. Choose a place and write directions to it in your notebook or in the box. Then click Show a model answer and compare.",
    "Nalaziš se na žutoj tački na mapi. Izaberi mjesto i napiši upute do njega u svesku ili u polje. Zatim klikni Show a model answer (Prikaži primjer odgovora) i uporedi.",
    "Haritadaki sarı noktadasın. Bir yer seç ve oraya giden yolu defterine ya da kutuya yaz. Sonra Show a model answer (Örnek cevabı göster) düğmesine tıkla ve karşılaştır."]));
  const MODELS={};
  FOLLOW.forEach(f=>{ if(!MODELS[f.a]) MODELS[f.a]={steps:f.steps,route:f.route}; });
  GIVE.forEach(g=>{ if(!MODELS[g.a]) MODELS[g.a]={steps:g.o[0],route:g.route}; });
  const ids=Object.keys(MODELS).sort((a,c)=>BLD[a].l.localeCompare(BLD[c].l));
  const sel=el("select",{id:"yt-place"}); ids.forEach(id=>sel.append(el("option",{value:id,text:BLD[id].l})));
  sel.value="hospital";
  const ta=el("textarea",{id:"yt-text",placeholder:"Go straight ahead and…"});
  const show=el("button",{class:"btn",type:"button",text:"Show a model answer"});
  const model=el("div",{class:"steps"});
  const mb=el("div",{class:"mapbox"});
  const bank=el("div",{class:"wordbank"});
  ["Go straight ahead.","Turn left / right on … Street.","Go past …","It's on the left / right.","next to","across from","between … and …","on the corner of …","It's the first building on the …"].forEach(w=>bank.append(el("span",{text:w})));
  b.append(el("div",{class:"yt"},[
    el("label",{for:"yt-place",text:"Choose a place:"}),sel,
    el("span",{class:"hint",text:"Useful words:"}),bank,
    el("label",{for:"yt-text",text:"Your directions:"}),ta,
    el("div",{class:"nav"},[show]),model
  ]),mb);
  const map=buildMap(mb,{you:true});
  const reset=()=>{ model.innerHTML=""; map.clear(); map.mark(sel.value,"hl"); };
  sel.addEventListener("change",reset);
  show.onclick=()=>{
    const m=MODELS[sel.value]; model.innerHTML="";
    m.steps.forEach(k=>model.append(chip(...P[k])));
    map.clear(); map.mark(sel.value,"ok"); map.route(m.route);
  };
  reset();
}
